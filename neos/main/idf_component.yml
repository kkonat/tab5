dependencies:
  espressif/elf_loader: "*"
  espressif/m5stack_tab5_noglib: "*"
  # The P4 has no radio. This is the host half of ESP-Hosted, which puts the
  # ordinary esp_wifi API over SDIO to the ESP32-C6 on the other side of the
  # board. Pinned to the 1.x line because 2.x of the slave protocol is what the
  # factory C6 firmware on this unit speaks, and that firmware cannot be read
  # back or rebuilt from here - see docs/specs_fingerprint.md.
  espressif/esp_wifi_remote: "~1.4"
  # The BSP pulls espressif/usb (for the UVC camera). Every 1.x release we can
  # resolve declares idf>=5.4 but calls usb_dwc_hal functions that do not exist
  # until a later IDF, so it will not compile on 5.4.2. Point the dependency at
  # the IDF's own usb component instead.
  #
  # neos_midi.c does use it now - it is a USB MIDI host class driver on the
  # USB-A socket - and it is written against the IDF's API, which is the half
  # of espressif/usb that both versions agree on. What the managed component
  # adds on top is the device stack, and nothing here wants that: the USB-C
  # socket is the programming port.
  #
  # $IDF_PATH is expanded by the component manager when the path is resolved,
  # not when the manifest is parsed, so this follows whichever IDF is exported
  # in the shell doing the build rather than naming one machine's install.
  # A shell that has not been through IDF's export script has no IDF_PATH and
  # the configure step says so; .env.local can hold it for the scripts.
  espressif/usb:
    version: "*"
    override_path: "$IDF_PATH/components/usb"
